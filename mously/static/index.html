<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mously">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta id="themeColor" name="theme-color" content="#0c0d10">
  <link rel="apple-touch-icon" sizes="180x180" href="/mously-touch-icon.png">
  <link rel="icon" type="image/png" href="/mously-touch-icon.png">
  <title>Mously</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      --page: #0c0d10;
      --surface: #15171c;
      --surface-raised: #191c22;
      --control: #1c1f25;
      --control-active: #343944;
      --field: #17191e;
      --dialog: #14161b;
      --select: #20232a;
      --border: #30343c;
      --border-strong: #3b404a;
      --select-border: #454a55;
      --text: #f7f7f8;
      --control-text: #f5f5f6;
      --muted: #9298a3;
      --subtle: #858b96;
      --pad-hint: #6f747f;
      --pad-gradient: radial-gradient(circle at 50% 38%, #232730, #15171c 72%);
      --accent: #3478f6;
      --accent-soft: #72a9ff;
      --accent-text: #dce9ff;
      --success: #63df91;
      --success-text: #b7ffcd;
      --success-surface: #245235;
      --zoom-surface: #31543c;
      --zoom-active: #3c754e;
      --switch-off: #3a3e47;
      --popover: #0a0b0ef2;
      --popover-text: #dbe9ff;
      --overlay: #0009;
      --shadow: #000a;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page: #f4f5f7;
      --surface: #ffffff;
      --surface-raised: #f0f2f5;
      --control: #ffffff;
      --control-active: #e1e5eb;
      --field: #ffffff;
      --dialog: #f8f9fb;
      --select: #ffffff;
      --border: #d4d8df;
      --border-strong: #c6cbd4;
      --select-border: #b9c0ca;
      --text: #17191d;
      --control-text: #1b1d22;
      --muted: #626a76;
      --subtle: #6e7682;
      --pad-hint: #737b87;
      --pad-gradient: radial-gradient(circle at 50% 38%, #ffffff, #edf0f4 72%);
      --accent: #1769e0;
      --accent-soft: #397fdc;
      --accent-text: #ffffff;
      --success: #168a45;
      --success-text: #126b38;
      --success-surface: #d9f2e2;
      --zoom-surface: #dcefe3;
      --zoom-active: #c2e5cf;
      --switch-off: #aeb4be;
      --popover: #20242bea;
      --popover-text: #ffffff;
      --overlay: #10131a66;
      --shadow: #18202e3d;
    }
    :root[data-theme="oled"] {
      color-scheme: dark;
      --page: #000000;
      --surface: #000000;
      --surface-raised: #000000;
      --control: #000000;
      --control-active: #161616;
      --field: #000000;
      --dialog: #000000;
      --select: #080808;
      --border: #262626;
      --border-strong: #303030;
      --select-border: #3a3a3a;
      --text: #f7f7f8;
      --control-text: #f5f5f6;
      --muted: #8c8c92;
      --subtle: #7d7d83;
      --pad-hint: #68686e;
      --pad-gradient: #000000;
      --accent: #1769e0;
      --accent-soft: #4389ec;
      --accent-text: #dce9ff;
      --success: #42c978;
      --success-text: #8eeeb1;
      --success-surface: #092b16;
      --zoom-surface: #092b16;
      --zoom-active: #124222;
      --switch-off: #333333;
      --popover: #111111f2;
      --popover-text: #ffffff;
      --overlay: #000c;
      --shadow: #000;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    input[type="text"] { -webkit-user-select: text; user-select: text; }
    html { margin: 0; height: 100%; overflow: hidden; background: var(--page); }
    body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: var(--page); color: var(--text); touch-action: none; padding: max(4px, env(safe-area-inset-top)) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto auto; gap: 0; }
    @media (display-mode: standalone), (display-mode: fullscreen) {
      /* iOS can expose a shorter dynamic viewport to an installed app even
         though it draws the page across the full screen. Use the large
         viewport there so the grid reaches the home-indicator inset, and
         keep the header below the status-bar fade. */
      body { height: 100vh; height: 100lvh; padding-top: max(12px, calc(env(safe-area-inset-top) + 8px)); }
    }
    header { display: flex; min-height: 34px; align-items: center; justify-content: space-between; padding: 0 14px; }
    h1 { font-size: 16px; margin: 0; letter-spacing: -.3px; }
    #status { display: flex; align-items: center; gap: 6px; color: #ffb84d; font-size: 12px; }
    #status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
    #status.online { color: var(--success); }
    #controlSurface { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; min-height: 150px; overflow: hidden; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface); }
    #controlSurface[data-scroll-bar="off"] { grid-template-columns: minmax(0, 1fr) 64px; }
    #controlSurface[data-scroll-bar="off"] .scrollControl { display: none; }
    #pad { position: relative; min-width: 0; min-height: 150px; border: 0; border-radius: 0; background: var(--pad-gradient); overflow: hidden; }
    #pad::after { white-space: pre; position: absolute; z-index: 1; inset: 0; display: grid; place-content: center; text-align: center; color: var(--pad-hint); font-size: 14px; line-height: 1.7; pointer-events: none; }
    #pad[data-mode="absolute"]::after { content: "Touch to position pointer\A Two fingers scroll and pan"; }
    #pad[data-mode="relative"]::after { content: "Drag to move pointer\A Two fingers scroll and pan"; }
    #pad[data-mode="absolute"][data-pinch-zoom="on"]::after { content: "Touch to position pointer\A Two fingers pan · three fingers pinch"; }
    #pad[data-mode="relative"][data-pinch-zoom="on"]::after { content: "drag to move pointer\A two fingers pan\A three fingers pinch"; }
    #pad.confirmed { animation: pad-confirmed 360ms ease-out; }
    .volumeControl, .scrollControl { position: relative; display: grid; grid-template-rows: 48px minmax(48px, 1fr) 48px; place-items: center; background: var(--surface-raised); transition: background 140ms, box-shadow 140ms; }
    .volumeControl { border-left: 1px solid var(--border); }
    .scrollControl { border-right: 1px solid var(--border); }
    .volumeControl.zooming { background: var(--zoom-surface); box-shadow: none; }
    .volumeStep, .scrollStep { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; background: var(--control); color: var(--control-text); font-size: 22px; }
    .volumeStep:first-child, .scrollStep:first-child { grid-row: 1; }
    .volumeStep:last-child, .scrollStep:last-child { grid-row: 3; }
    #volume { grid-row: 2; width: 100%; height: calc(100% - 12px); min-height: 48px; margin: 6px 0; writing-mode: vertical-lr; direction: rtl; accent-color: var(--accent-soft); cursor: ns-resize; touch-action: none; }
    #volume::-webkit-slider-runnable-track { width: 5px; border-radius: 3px; background: var(--control-active); }
    #volume::-webkit-slider-thumb { width: 24px; height: 24px; margin-left: -9.5px; border: 2px solid var(--accent-text); border-radius: 50%; background: var(--accent-soft); box-shadow: 0 1px 5px var(--shadow); }
    #scrollSwipe { grid-row: 2; display: flex; align-items: center; justify-content: center; align-self: stretch; width: 100%; margin: 0; border: 0; background: var(--surface-raised); color: var(--muted); touch-action: none; cursor: ns-resize; }
    #scrollSwipe::after { content: "SCROLL"; writing-mode: vertical-rl; text-orientation: mixed; font-size: 10px; font-weight: 750; letter-spacing: .6px; }
    #scrollSwipe[data-direction] { background: var(--control-active); color: var(--text); }
    #zoomSwipe { display: none; grid-row: 1 / -1; align-self: stretch; width: 100%; margin: 0; border: 0; border-radius: 0; background: var(--zoom-surface); color: var(--success-text); touch-action: none; cursor: ns-resize; }
    #zoomSwipe::after { align-self: center; width: 100%; white-space: pre; text-align: center; font-size: 10px; font-weight: 750; line-height: 2.4; letter-spacing: .6px; }
    #zoomSwipe[data-direction="in"], #zoomSwipe[data-direction="out"] { background: var(--zoom-active); }
    .volumeControl.zooming .volumeStep, .volumeControl.zooming #volume { display: none; }
    .volumeControl.zooming #volumeValue { display: none; }
    .volumeControl.zooming #zoomSwipe { display: flex; }
    .volumeControl.zooming #zoomSwipe::after { content: "↑\A SWIPE\A ↓"; }
    #volumeValue { position: absolute; right: 60px; z-index: 4; min-width: 46px; padding: 6px; border-radius: 8px; background: var(--popover); color: var(--popover-text); text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; opacity: 0; transform: translateX(4px); transition: opacity 120ms, transform 120ms; }
    .volumeControl.adjusting #volumeValue { opacity: 1; transform: translateX(0); }
    .tapRipple { position: absolute; z-index: 2; display: grid; place-items: center; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 3px solid var(--success); border-radius: 50%; background: #63df913d; color: var(--success-text); box-shadow: 0 0 20px #63df9166; font-size: 22px; font-weight: 800; pointer-events: none; animation: tap-ripple 420ms ease-out forwards; }
    .row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; border-left: 1px solid var(--border); }
    .row button { border-width: 0 1px 1px 0; }
    button { min-height: 50px; border: 1px solid var(--border); border-radius: 0; background: var(--control); color: var(--control-text); font: inherit; font-size: 16px; font-weight: 650; }
    button:active { background: var(--control-active); transform: scale(.98); }
    button:disabled { opacity: .38; background: var(--surface); }
    button.confirmed { animation: button-confirmed 360ms ease-out; }
    .quickBar { grid-template-columns: 1.05fr 1.55fr 1fr 1fr 1fr; }
    .quickBar button { min-width: 0; min-height: 46px; padding: 0 8px; font-size: 13px; }
    .quickBar #appsToggle { font-size: 15px; }
    .quickBar #zoomHold { color: var(--success-text); touch-action: none; }
    .quickBar #zoomHold.holding { background: var(--success-surface); box-shadow: inset 0 0 0 2px var(--success); transform: scale(.98); }
    .clicks button { min-height: 58px; font-size: 14px; }
    .media { grid-template-columns: 1fr 1.35fr 1fr; }
    .media button { min-height: 66px; font-size: 20px; }
    .media button[data-media="play_pause"] { border-color: var(--accent-soft); background: var(--accent); color: white; font-size: 23px; }
    .buttonLabel { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 550; letter-spacing: .2px; }
    .media button[data-media="play_pause"] .buttonLabel { color: var(--accent-text); }
    #keyboard { display: none; grid-template-columns: 1fr auto; gap: 0; border-left: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); }
    #keyboard.open { display: grid; }
    #text { min-width: 0; height: 50px; border: 0; border-right: 1px solid var(--border-strong); border-radius: 0; padding: 0 13px; background: var(--field); color: var(--text); font-size: 16px; outline: none; }
    #send { min-height: 50px; padding: 0 20px; border: 0; border-right: 1px solid var(--border-strong); color: var(--accent-soft); }
    dialog { width: 100%; max-width: 460px; max-height: 82vh; margin: auto auto 0; border: 1px solid var(--border-strong); border-bottom: 0; border-radius: 0; padding: 12px 0 0; background: var(--dialog); color: var(--text); box-shadow: 0 20px 80px var(--shadow); }
    dialog::backdrop { background: var(--overlay); backdrop-filter: blur(3px); }
    .dialogHeader { display: flex; align-items: center; justify-content: space-between; margin: 0; padding: 0 12px 12px; }
    .dialogHeader h2 { margin: 0; font-size: 18px; }
    .dialogHeader button { width: 40px; min-height: 40px; border-radius: 0; }
    .selectionList { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; overflow-y: auto; max-height: calc(82vh - 64px); border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .selectionList button { position: relative; min-height: 58px; padding: 8px 24px 8px 12px; overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; border: 0; border-right: 1px solid var(--border); border-top: 1px solid var(--border); }
    .selectionList button.active::after { content: ""; position: absolute; right: 12px; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--success); transform: translateY(-50%); }
    .selectionList .empty { grid-column: 1 / -1; color: var(--subtle); text-align: center; padding: 24px; }
    .occasionalGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; padding: 0; border-left: 1px solid var(--border); }
    .occasionalGrid button { border-width: 1px 1px 0 0; }
    .occasionalGrid button { min-height: 58px; font-size: 14px; }
    .occasionalGrid .wide { grid-column: 1 / -1; }
    .dialogSectionLabel { grid-column: 1 / -1; margin: 0; padding: 14px 12px 7px; color: var(--subtle); font-size: 11px; font-weight: 650; letter-spacing: .7px; text-transform: uppercase; }
    .settingsContent { max-height: calc(82vh - 64px); overflow-y: auto; border-top: 1px solid var(--border); }
    .settingsSection { padding: 14px; border-bottom: 1px solid var(--border); }
    .settingsSection h3 { margin: 0 0 10px; color: var(--subtle); font-size: 11px; letter-spacing: .7px; text-transform: uppercase; }
    .choiceGroup { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--border); }
    .choiceGroup.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choiceGroup button { position: relative; min-height: 58px; padding: 8px 6px; border: 0; border-right: 1px solid var(--border); font-size: 14px; }
    .choiceGroup button:last-child { border-right: 0; }
    .choiceGroup button.active { background: var(--control-active); box-shadow: inset 0 -3px var(--accent); }
    .choiceGroup small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 500; }
    .settingRow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; min-height: 50px; }
    .settingRow + .settingRow { border-top: 1px solid var(--border); }
    .settingRow label, .settingRow .settingLabel { font-size: 14px; }
    .settingRow button { min-height: 38px; padding: 0 12px; border-radius: 7px; font-size: 13px; }
    .settingRow select { min-width: 104px; height: 38px; border: 1px solid var(--select-border); border-radius: 7px; padding: 0 28px 0 10px; background: var(--select); color: var(--text); font: inherit; }
    .switch { position: relative; width: 48px; height: 28px; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch span { position: absolute; inset: 0; border-radius: 14px; background: var(--switch-off); transition: background 160ms; }
    .switch span::after { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; border-radius: 50%; background: white; transition: transform 160ms; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(20px); }
    .zoomHint { margin: 9px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    @keyframes tap-ripple { from { opacity: .95; transform: scale(.3); } to { opacity: 0; transform: scale(1.45); } }
    @keyframes pad-confirmed { 0%, 100% { box-shadow: none; } 35% { box-shadow: inset 0 0 0 2px var(--accent-soft), inset 0 0 28px #4e91ff1f; } }
    @keyframes button-confirmed { 0%, 100% { background: var(--control); border-color: var(--border); } 35% { background: var(--success-surface); border-color: var(--success); box-shadow: 0 0 0 3px #63df9124; } }
    @media (prefers-reduced-motion: reduce) { .tapRipple, #pad.confirmed, button.confirmed { animation-duration: 80ms; } }
    @media (max-height: 600px) {
      body { padding-top: max(4px, env(safe-area-inset-top)); }
      header { min-height: 30px; }
      #controlSurface, #pad { min-height: 72px; }
      .quickBar button { min-height: 38px; }
      .clicks button { min-height: 46px; }
      .media button { min-height: 52px; }
      input, #send { height: 42px; min-height: 42px; }
    }
  </style>
</head>
<body>
  <header><h1>Mously</h1><span id="status">Connecting…</span></header>
  <section class="row quickBar" aria-label="Quick actions">
    <button id="zoomHold" aria-label="Hold to show the zoom swipe area" aria-pressed="false">Hold Zoom</button>
    <button id="appsToggle">▦ Apps</button>
    <button data-media="mute" aria-label="Mute">Mute</button>
    <button id="keyboardToggle">Keyboard</button>
    <button id="moreToggle" aria-haspopup="dialog">••• More</button>
  </section>
  <section id="controlSurface" aria-label="Scroll, pointer, and volume controls">
    <div class="scrollControl" aria-label="Page scroll controls">
      <button class="scrollStep" data-scroll-step="up" aria-label="Scroll up">↑</button>
      <div id="scrollSwipe" role="region" aria-label="Swipe vertically to scroll the page"></div>
      <button class="scrollStep" data-scroll-step="down" aria-label="Scroll down">↓</button>
    </div>
    <main id="pad" data-mode="absolute" aria-label="Trackpad"></main>
    <div class="volumeControl">
      <button class="volumeStep" data-media="volume_up" aria-label="Volume up">＋</button>
      <input id="volume" type="range" min="0" max="100" value="50" step="1" aria-label="Output volume" aria-orientation="vertical">
      <div id="zoomSwipe" role="region" aria-label="Swipe up to zoom in or down to zoom out" aria-hidden="true"></div>
      <output id="volumeValue" for="volume">50%</output>
      <button class="volumeStep" data-media="volume_down" aria-label="Volume down">−</button>
    </div>
  </section>
  <section class="row clicks" aria-label="Mouse buttons">
    <button data-click="left">Left click<span class="buttonLabel">PRIMARY</span></button>
    <button data-click="left" data-count="2">Double<span class="buttonLabel">CLICK</span></button>
    <button data-click="right">Right click<span class="buttonLabel">SECONDARY</span></button>
  </section>
  <section class="row media" aria-label="Media controls">
    <button data-key="left" aria-label="Skip back 5 seconds" title="Skip back 5 seconds">↶ 5<span class="buttonLabel">BACK</span></button>
    <button data-media="play_pause" aria-label="Play or pause">▶︎❚❚<span class="buttonLabel">PLAY / PAUSE</span></button>
    <button data-key="right" aria-label="Skip forward 5 seconds" title="Skip forward 5 seconds">5 ↷<span class="buttonLabel">AHEAD</span></button>
  </section>
  <section id="keyboard">
    <input id="text" autocomplete="off" autocorrect="on" placeholder="Type on the Mac…">
    <button id="send">Send</button>
  </section>
  <dialog id="appsDialog">
    <div class="dialogHeader"><h2>Switch app</h2><button id="appsClose" aria-label="Close">×</button></div>
    <div id="appList" class="selectionList"><div class="empty">Loading open apps…</div></div>
  </dialog>
  <dialog id="moreDialog">
    <div class="dialogHeader"><h2>More</h2><button id="moreClose" aria-label="Close">×</button></div>
    <div class="occasionalGrid">
      <div class="dialogSectionLabel">Preferences</div>
      <button id="settingsToggle" class="wide">⚙︎ Settings</button>
      <div class="dialogSectionLabel">Occasional keys</div>
      <button data-key="fullscreen" data-close-more>Fullscreen</button>
      <button data-key="escape" data-close-more>Esc</button>
    </div>
  </dialog>
  <dialog id="settingsDialog">
    <div class="dialogHeader"><h2>Settings</h2><button id="settingsClose" aria-label="Close">×</button></div>
    <div class="settingsContent">
      <section class="settingsSection" aria-labelledby="appearanceHeading">
        <h3 id="appearanceHeading">Appearance</h3>
        <div class="choiceGroup" id="themeChoices">
          <button data-theme-choice="default">Default<small>Original dark</small></button>
          <button data-theme-choice="light">Light<small>Bright</small></button>
          <button data-theme-choice="oled">OLED<small>True black</small></button>
        </div>
      </section>
      <section class="settingsSection" aria-labelledby="pointerHeading">
        <h3 id="pointerHeading">Pointer</h3>
        <div class="choiceGroup two" id="modeChoices">
          <button data-mode-choice="absolute">Absolute<small>Matches screen</small></button>
          <button data-mode-choice="relative">Relative<small>Trackpad drag</small></button>
        </div>
        <div class="settingRow">
          <span class="settingLabel">Mapped screen</span>
          <button id="screenToggle">Choose…</button>
        </div>
        <div class="settingRow">
          <label for="mouseSensitivity">Mouse sensitivity</label>
          <select id="mouseSensitivity">
            <option value="gentle">Gentle</option>
            <option value="normal">Normal</option>
            <option value="fast">Fast</option>
          </select>
        </div>
        <div class="settingRow">
          <label for="panSensitivity">Pan sensitivity</label>
          <select id="panSensitivity">
            <option value="gentle">Gentle</option>
            <option value="normal">Normal</option>
            <option value="fast">Fast</option>
          </select>
        </div>
        <div class="settingRow">
          <label for="scrollBar">Left scroll bar</label>
          <label class="switch"><input id="scrollBar" type="checkbox"><span aria-hidden="true"></span></label>
        </div>
      </section>
      <section class="settingsSection" aria-labelledby="pinchHeading">
        <h3 id="pinchHeading">Pinch zoom</h3>
        <div class="settingRow">
          <label for="pinchZoom">Three-finger pinch</label>
          <label class="switch"><input id="pinchZoom" type="checkbox"><span aria-hidden="true"></span></label>
        </div>
        <div class="settingRow">
          <label for="pinchSensitivity">Pinch zoom sensitivity</label>
          <select id="pinchSensitivity">
            <option value="gentle">Gentle</option>
            <option value="normal">Normal</option>
            <option value="fast">Fast</option>
          </select>
        </div>
        <p class="zoomHint">Keep one finger planted, then pinch with the other two. Two fingers pan or scroll.</p>
      </section>
    </div>
  </dialog>
  <dialog id="screensDialog">
    <div class="dialogHeader"><h2>Map to screen</h2><button id="screensClose" aria-label="Back">‹</button></div>
    <div id="screenList" class="selectionList"><div class="empty">Loading screens…</div></div>
  </dialog>
  <script>
    const controlSurface = document.querySelector('#controlSurface');
    const pad = document.querySelector('#pad');
    const status = document.querySelector('#status');
    const keyboard = document.querySelector('#keyboard');
    const text = document.querySelector('#text');
    const appsDialog = document.querySelector('#appsDialog');

      if (!apps.length) { appList.innerHTML = '<div class="empty">No open apps found</div>'; return; }
      for (const app of apps) {
        const button = document.createElement('button');
        button.textContent = app.name;
        button.className = app.active ? 'active' : '';
        button.setAttribute('aria-label', `${app.name}${app.active ? ', current app' : ''}`);
        button.onclick = () => { haptic(); send('activate_app', {pid: app.pid}); };
        appList.append(button);
      }
    }
    screenToggle.onclick = () => {
      settingsDialog.close();
      screenList.innerHTML = '<div class="empty">Loading screens…</div>';
      screensDialog.showModal();
      send('list_displays');
    };
    function returnToSettings() {
      screensDialog.close();
      settingsDialog.showModal();
    }
    document.querySelector('#screensClose').onclick = returnToSettings;
    screensDialog.addEventListener('click', e => { if (e.target === screensDialog) returnToSettings(); });
    screensDialog.addEventListener('cancel', e => { e.preventDefault(); returnToSettings(); });
    function renderDisplays(displays) {
      screenList.replaceChildren();
      const selected = displays.find(display => display.selected);
      screenToggle.title = selected ? `Mapped to ${selected.name}` : 'Choose mapped screen';
      if (!displays.length) { screenList.innerHTML = '<div class="empty">No screens found</div>'; return; }
      for (const display of displays) {
        const button = document.createElement('button');
        button.textContent = `${display.name} · ${display.width}×${display.height}`;
        button.className = display.selected ? 'active' : '';
        button.setAttribute('aria-label', `${display.name}, ${display.width} by ${display.height}${display.selected ? ', selected' : ''}`);
        button.onclick = () => { haptic(); send('select_display', {display_id: display.display_id}); };
        screenList.append(button);
      }
    }
    modeChoices.forEach(button => button.onclick = () => {
      haptic();
      setInputMode(button.dataset.modeChoice);
    });
    themeChoices.forEach(button => button.onclick = () => {
      haptic();
      setAppearance(button.dataset.themeChoice);
    });
    mouseSensitivity.value = mouseSensitivitySetting;
    panSensitivity.value = panSensitivitySetting;
    scrollBar.checked = scrollBarEnabled;
    controlSurface.dataset.scrollBar = scrollBarEnabled ? 'on' : 'off';
    pinchZoom.checked = pinchZoomEnabled;
    pad.dataset.pinchZoom = pinchZoomEnabled ? 'on' : 'off';
    pinchSensitivity.value = zoomSensitivity;
    mouseSensitivity.onchange = () => {
      mouseSensitivitySetting = validSensitivity(mouseSensitivity.value);
      localStorage.setItem('mouslyMouseSensitivity', mouseSensitivitySetting);
    };
    panSensitivity.onchange = () => {
      panSensitivitySetting = validSensitivity(panSensitivity.value);
      localStorage.setItem('mouslyPanSensitivity', panSensitivitySetting);
    };
    scrollBar.onchange = () => {
      scrollBarEnabled = scrollBar.checked;
      controlSurface.dataset.scrollBar = scrollBarEnabled ? 'on' : 'off';
      localStorage.setItem('mouslyScrollBar', String(scrollBarEnabled));
    };
    pinchZoom.onchange = () => {
      pinchZoomEnabled = pinchZoom.checked;
      pad.dataset.pinchZoom = pinchZoomEnabled ? 'on' : 'off';
      localStorage.setItem('mouslyPinchZoom', String(pinchZoomEnabled));
    };
    pinchSensitivity.onchange = () => {
      zoomSensitivity = validSensitivity(pinchSensitivity.value);
      localStorage.setItem('mouslyZoomSensitivity', zoomSensitivity);
    };
    function sendText() { if (text.value) { send('text', {text: text.value}); text.value = ''; } }
    document.querySelector('#send').onclick = sendText;
    text.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendText(); send('key', {key: 'enter'}); } });
    setAppearance(appearance);
    setInputMode(inputMode);
    connect();
  </script>
</body>
</html>
